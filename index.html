.ar{direction:rtl;font-family:'Amiri',serif;line-height:2.3;transition:filter .3s}

.glass{background:rgba(15,23,42,.8);backdrop-filter:blur(16px)}

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
<header class="border-b border-slate-800 sticky top-0 z-40 glass">
 <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center gap-2">
  <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-500 to-teal-300 grid place-items-center text-slate-950 font-extrabold">ML</div><span class="text-lg font-extrabold tracking-tight">MUTQINLAB</span></div>
  <div class="flex items-center gap-2">
   <select id="lang" onchange="setLang(this.value)" class="bg-slate-900 border border-slate-700 text-xs font-semibold text-brand-400 px-2 py-2 rounded-xl"><option value="id">🇮🇩 ID</option><option value="ar">🇸🇦 AR</option><option value="en">🇬🇧 EN</option></select>

  </div>
 </div>
</header>
<div class="border-b border-slate-800 bg-slate-900/70"><div class="max-w-5xl mx-auto px-4 py-2 flex justify-between items-center gap-3 text-xs"><div><b id="clk" class="text-base font-extrabold tabular-nums"></b><span id="hij" class="text-slate-400 ms-2"></span></div><div id="cdn" class="text-right font-semibold tabular-nums"></div></div></div>

<main class="max-w-5xl mx-auto px-4 py-6 flex-grow w-full space-y-5">
 <section class="grid grid-cols-2 lg:grid-cols-4 gap-3">
  <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl"><span data-i="s1" class="text-xs text-slate-400 block"></span><b id="st1" class="text-2xl font-extrabold">0</b></div>

  <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl"><span data-i="s4" class="text-xs text-slate-400 block"></span><b id="st4" class="text-2xl font-extrabold text-yellow-400">🔥 0</b></div>
 </section>

 <section class="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
  <div class="flex justify-between items-center text-xs"><b data-i="wk"></b><label class="text-slate-400 flex items-center gap-2"><span data-i="goal"></span>

  <button id="tabL" onclick="tab('L')" data-i="tabL" class="flex-1 py-2.5 rounded-xl text-sm font-bold"></button>
  <button id="tabM" onclick="tab('M')" class="flex-1 py-2.5 rounded-xl text-sm font-bold"><span data-i="tabM"></span> <span id="qn" class="ml-1 bg-amber-500 text-slate-950 text-xs px-2 py-0.5 rounded-full">0</span></button>
  <button id="tabT" onclick="tab('T')" data-i="tabT" class="flex-1 py-2.5 rounded-xl text-sm font-bold"></button>
 </nav>

 <section id="pG"><div id="gur"></div></section>

 <section id="pL" class="space-y-4">
  <div id="zg"></div>
  <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl flex flex-wrap items-center gap-3">

   <label class="text-xs text-slate-400 flex items-center gap-2"><span data-i="loop"></span>
    <select id="loops" class="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1.5 text-brand-400 font-bold"><option>1</option><option selected>3</option><option>5</option><option>10</option><option>20</option></select>×</label>
   <select id="qari" onchange="setQari(this.value)" class="bg-slate-950 border border-slate-800 rounded-xl px-2 py-2.5 text-xs font-semibold"><option value="ar.alafasy">Alafasy</option><option value="ar.husary">Al-Husary</option><option value="ar.minshawi">Minshawi</option><option value="ar.abdulbasitmurattal">Abdul Basit</option><option value="ar.abdurrahmaansudais">Sudais</option><option value="ar.saoodshuraym">Shuraym</option></select>
   <button id="fbtn" onclick="focusMode()" data-i="focus" class="bg-slate-800 border border-slate-700 px-4 py-2.5 rounded-xl text-xs font-bold"></button>
   <button onclick="playAll()" data-i="all" class="bg-slate-800 border border-slate-700 px-4 py-2.5 rounded-xl text-xs font-bold"></button>
  </div>
  <h3 id="title" class="font-bold text-lg px-1"></h3>
  <div id="list" class="space-y-4"></div>
 </section>

 <section id="pM" class="hidden space-y-4"><div id="mg"></div><div id="mur"></div></section>
 <section id="pT" class="hidden"><div id="tst"></div></section>

 <details class="bg-slate-900/40 border border-slate-800 rounded-2xl p-5">
  <summary data-i="meth" class="font-bold cursor-pointer"></summary>
  <ol class="list-decimal ps-5 mt-3 space-y-2 text-sm text-slate-300"><li data-i="m1"></li><li data-i="m2"></li><li data-i="m3"></li><li data-i="m4"></li></ol>
 </details>
</main>

<footer class="border-t border-slate-800 py-6 text-center text-xs text-slate-500">
 <p class="font-bold text-slate-300">MutqinLab — Open Source</p><p data-i="foot" class="mt-1"></p>
</footer>

<div id="modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4">
 <div class="bg-slate-900 border border-slate-800 rounded-3xl p-7 max-w-sm w-full text-center space-y-4 relative">
  <button onclick="modal(0)" class="absolute top-4 right-5 text-slate-400">✕</button>
  <h3 data-i="sync" class="text-xl font-bold"></h3>
  <p id="cfgInfo" class="text-xs text-slate-400 leading-relaxed"></p>
  <button onclick="login()" class="w-full bg-slate-950 border border-slate-700 hover:bg-slate-800 font-semibold py-3 rounded-xl text-sm" data-i="google"></button>
 </div>
</div>

<script type="module">

const $=id=>document.getElementById(id);
const DAY=864e5,today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/DAY);
const I={
id:{dir:'ltr',sub:'',s1:'Ayat Dihafal',s2:'Indeks Mutqin',s3:'Antrean Murojaah',s4:'Streak',tabL:'📖 Ziyadah',tabM:'🔁 Murojaah',loop:'Ulang audio',focus:'👁️ Mode Blur',all:'▶ Putar Semua',hafal:'✅ Tandai Hafal',hafald:'✓ Dalam SRS',audio:'🔊 Audio',empty:'Alhamdulillah, tidak ada murojaah hari ini 🎉 Tambah hafalan baru di tab Belajar.',cue:'Lanjutkan ayat setelah ini:',start:'(Awal surah)',show:'Tampilkan Jawaban',day:'hr',b0:'🔴 Lupa',b1:'🟡 Ragu',b2:'🟢 Mutqin',login:'Masuk Cloud',logout:'Keluar',sync:'Sinkronkan ke Cloud',google:'Lanjutkan dengan Google',nocfg:'Mode offline: isi konfigurasi Firebase di index.html untuk sinkronisasi antar perangkat.',cfg:'Progres tersimpan aman & tersinkron di semua perangkatmu.',toastH:'Alhamdulillah! Murojaah pertama besok (setelah tidur).',toastR:'Tercatat. Jadwal berikutnya: ',meth:'🧠 Metode Hafalan yang Terbukti',m1:'Talqin: dengarkan ayat dari qari 3–5× sambil melihat mushaf, lalu baca bersama.',m2:'Tikrar: ulangi audio 10–20× (atur "Ulang audio"), lalu aktifkan Mode Blur dan tes dirimu.',m3:'Sambung ayat: murojaah selalu dimulai dari ayat sebelumnya — persis seperti ujian setoran.',m4:'Ziyadah sedikit, murojaah banyak: tambah ≤5 ayat/hari, jaga antrean murojaah tetap bersih setiap hari.',foot:'Membantu penghafal Al-Qur\'an seluruh dunia — 100% gratis',err:'Gagal memuat. Periksa koneksi internet.'},
en:{dir:'ltr',s1:'Verses Memorized',s2:'Mutqin Index',s3:'Review Queue',s4:'Streak',tabL:'📖 Ziyadah',tabM:'🔁 Review',loop:'Audio loop',focus:'👁️ Blur Mode',all:'▶ Play All',hafal:'✅ Mark Memorized',hafald:'✓ In SRS',audio:'🔊 Audio',empty:'Alhamdulillah, nothing to review today 🎉 Add new verses in the Learn tab.',cue:'Continue the verse after this one:',start:'(Start of surah)',show:'Show Answer',day:'d',b0:'🔴 Forgot',b1:'🟡 Unsure',b2:'🟢 Mutqin',login:'Cloud Login',logout:'Sign out',sync:'Cloud Sync',google:'Continue with Google',nocfg:'Offline mode: add your Firebase config in index.html to sync across devices.',cfg:'Your progress is saved and synced across all your devices.',toastH:'Alhamdulillah! First review tomorrow (after sleep).',toastR:'Saved. Next review in: ',meth:'🧠 Proven Memorization Method',m1:'Talqin: listen to the verse 3–5× while reading, then recite along.',m2:'Tikrar: loop the audio 10–20× (set "Audio loop"), then enable Blur Mode and test yourself.',m3:'Verse linking: review always starts from the previous verse — just like a real recitation exam.',m4:'Little new, lots of review: add ≤5 verses/day and clear your review queue daily.',foot:'Empowering Quran memorizers worldwide — 100% free',err:'Failed to load. Check your connection.'},
ar:{dir:'rtl',s1:'الآيات المحفوظة',s2:'مؤشر الإتقان',s3:'قائمة المراجعة',s4:'الاستمرارية',tabL:'📖 زيادة',tabM:'🔁 مراجعة',loop:'تكرار الصوت',focus:'👁️ وضع التغطية',all:'▶ تشغيل الكل',hafal:'✅ تم الحفظ',hafald:'✓ في المراجعة',audio:'🔊 صوت',empty:'الحمد لله، لا مراجعة اليوم 🎉 أضف محفوظات جديدة من تبويب تعلّم.',cue:'أكمل الآية التي بعد هذه:',start:'(بداية السورة)',show:'أظهر الجواب',day:'ي',b0:'🔴 نسيت',b1:'🟡 متردد',b2:'🟢 متقن',login:'تسجيل الدخول',logout:'خروج',sync:'المزامنة السحابية',google:'المتابعة عبر Google',nocfg:'وضع بدون اتصال: أضف إعدادات Firebase للمزامنة بين الأجهزة.',cfg:'تقدمك محفوظ ومتزامن على كل أجهزتك.',toastH:'الحمد لله! أول مراجعة غداً (بعد النوم).',toastR:'تم. المراجعة القادمة بعد: ',meth:'🧠 منهج الحفظ المجرَّب',m1:'التلقين: استمع للآية ٣–٥ مرات مع النظر في المصحف ثم رددها.',m2:'التكرار: كرر الصوت ١٠–٢٠ مرة ثم فعّل وضع التغطية واختبر نفسك.',m3:'ربط الآيات: ابدأ المراجعة دائماً من الآية السابقة كما في العرض على الشيخ.',m4:'حفظ قليل ومراجعة كثيرة: ≤٥ آيات يومياً وأنجز قائمة المراجعة كل يوم.',foot:'نخدم حفظة القرآن حول العالم — مجاني ١٠٠٪',err:'تعذر التحميل. تحقق من الاتصال.'}};
Object.assign(I.id,{tabG:'🧭 Guru',tabT:'🎯 Tes',qari:'Qari',goal:'Target harian',wk:'Aktivitas 7 hari',unm:'Hapus ayat ini dari jadwal murojaah?',tdesc:'Tes sambung ayat: pilih ayat yang benar setelah ayat yang ditampilkan. Jawaban salah dijadwalkan murojaah hari ini.',tstart:'Mulai Tes',tq:'Ayat setelahnya adalah…',tnext:'Lanjut ▸',tscore:'Skor',tagain:'Ulangi Tes',noq:'Surah terlalu pendek untuk tes.',tgood:'MasyaAllah! Pertahankan.',tkeep:'Terus murojaah, in syaa Allah mutqin.'});
Object.assign(I.en,{tabG:'🧭 Coach',tabT:'🎯 Test',qari:'Reciter',goal:'Daily goal',wk:'Last 7 days',unm:'Remove this verse from your review schedule?',tdesc:'Verse-linking test: pick the correct verse that follows the one shown. Wrong answers are scheduled for review today.',tstart:'Start Test',tq:'The next verse is…',tnext:'Next ▸',tscore:'Score',tagain:'Retake Test',noq:'Surah too short for a test.',tgood:'MashaAllah! Keep it up.',tkeep:'Keep reviewing, in shaa Allah you will master it.'});
Object.assign(I.ar,{tabG:'🧭 المعلم',tabT:'🎯 اختبار',qari:'القارئ',goal:'الهدف اليومي',wk:'آخر ٧ أيام',unm:'حذف هذه الآية من جدول المراجعة؟',tdesc:'اختبار ربط الآيات: اختر الآية الصحيحة التي تلي الآية المعروضة. الإجابة الخاطئة تُجدول للمراجعة اليوم.',tstart:'ابدأ الاختبار',tq:'الآية التالية هي…',tnext:'التالي ▸',tscore:'النتيجة',tagain:'أعد الاختبار',noq:'السورة قصيرة جداً للاختبار.',tgood:'ما شاء الله! استمر.',tkeep:'واصل المراجعة بإذن الله ستتقن.'});
let lang=localStorage.ml_lang||'id';const T=k=>I[lang][k]??I.id[k]??'';

/* ===== 2. STATE & SRS (SM-2 yang disederhanakan) ===== */
let S={items:{},log:{}};try{S=JSON.parse(localStorage.ml_state)||S}catch{}
let user=null,db=null,fs=null,timer;
const live=k=>S.items[k]&&!S.items[k].x;
let qari=localStorage.ml_qari||'ar.alafasy';
const nx=(it,q)=>{const n={...it};
 if(q==0){n.l++;n.r=0;n.i=1;n.e=Math.max(1.3,n.e-.2)}
 else if(q==1){n.i=Math.max(1,Math.round(n.i*1.2));n.e=Math.max(1.3,n.e-.05);n.r++}
 else{n.i=n.r==0?3:n.r==1?7:Math.round(n.i*n.e);n.e=Math.min(3,n.e+.05);n.r++}
 n.d=today()+n.i;n.u=Date.now();return n};
const streak=()=>{let d=today(),c=0;if(!S.log[d])d--;while(S.log[d]){c++;d--}return c};
const act=()=>{S.log[today()]=(S.log[today()]||0)+1};
function save(){localStorage.ml_state=JSON.stringify(S);stats();clearTimeout(timer);if(user)timer=setTimeout(push,1500)}
function stats(){const a=Object.values(S.items).filter(i=>!i.x),due=a.filter(i=>i.d<=today()).length;
 $('st1').textContent=a.length;$('st2').textContent=(a.length?Math.round(a.filter(i=>i.i>=7).length/a.length*100):0)+'%';
 $('st3').textContent=due;$('qn').textContent=due;$('st4').textContent='🔥 '+streak();week()}
function week(){const g=S.goal||5,t=S.log[today()]||0,L=[6,5,4,3,2,1,0].map(o=>S.log[today()-o]||0),mx=Math.max(g,...L);
 $('gbar').style.width=Math.min(100,t/g*100)+'%';$('goal').value=g;
 $('wkc').innerHTML=L.map((c,x)=>`<div class="flex-1 h-full flex flex-col justify-end items-center gap-1" title="${c}"><div class="w-full rounded-t ${x==6?'bg-brand-500':'bg-brand-500/40'}" style="height:${c/mx*100}%;min-height:3px"></div><span class="text-[10px] text-slate-500">${new Date((today()-6+x)*DAY).toLocaleDateString(lang,{weekday:'narrow',timeZone:'UTC'})}</span></div>`).join('')}
const setGoal=v=>{S.goal=+v;save()};
const merge=r=>{for(const k in r.items||{}){const a=S.items[k],b=r.items[k];if(!a||b.u>a.u)S.items[k]=b}for(const d in r.log||{})S.log[d]=Math.max(S.log[d]||0,r.log[d]);if(r.goal&&!S.goal)S.goal=r.goal;if(r.plan&&!S.plan)S.plan=r.plan};

/* ===== 3. DATA AL-QUR'AN (alquran.cloud — gratis, tanpa API key) ===== */
async function api(p){const k='q_'+p;try{const c=localStorage.getItem(k);if(c)return JSON.parse(c)}catch{}
 const j=await(await fetch('https://api.alquran.cloud/v1/'+p)).json();try{localStorage.setItem(k,JSON.stringify(j.data))}catch{}return j.data}
const cache={};
async function getS(n){const ck=n+qari;if(cache[ck])return cache[ck];
 const[d,ad]=await Promise.all([api(`surah/${n}/editions/quran-uthmani,id.indonesian,en.sahih`),api(`surah/${n}/${qari}`)]);
 const V=d[0].ayahs.map((a,i)=>({n:a.numberInSurah,t:(i==0&&n!=1&&n!=9)?a.text.split(' ').slice(4).join(' '):a.text,id:d[1].ayahs[i].text,en:d[2].ayahs[i].text,au:ad.ayahs[i].audio}));
 return cache[ck]={name:d[0].name,en:d[0].englishName,V}}
const tr=v=>lang=='id'?v.id:lang=='en'?v.en:'';
const esc=s=>s.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* ===== 4. AUDIO: talqin & tikrar ===== */
const au=new Audio();let run=0,V=[],CN=1,focus=false;
function play(i,chain){if(!V[i])return;const my=++run;let n=0;hl(i);au.src=V[i].au;
 au.onended=()=>{if(my!=run)return;if(++n<+$('loops').value)au.play();else if(chain&&V[i+1]&&(zEnd<0||i<zEnd))play(i+1,true);else hl(-1)};
 au.play().catch(()=>toast(T('err')))}
function once(u){run++;au.onended=null;au.src=u;au.play()}
function hl(i){document.querySelectorAll('#list>div').forEach((e,x)=>{e.classList.toggle('playing',x==i);if(x==i)e.scrollIntoView({block:'center',behavior:'smooth'})})}

/* ===== 5. UI: BELAJAR ===== */
async function loadSurah(){CN=+$('sel').value;localStorage.ml_surah=CN;Q=null;zs=-1;zStart=0;zEnd=-1;run++;au.pause();$('list').innerHTML='<p class="text-center text-slate-500 py-10">…</p>';
 try{const s=await getS(CN);V=s.V;$('title').textContent=`${CN}. ${s.en} — ${s.name}`;draw()}catch{$('list').innerHTML=`<p class="text-center text-red-400 py-10">${T('err')}</p>`}}
function draw(){const tg=zTarget();zGuide();$('list').className=(focus?'focus ':'')+'space-y-4';
 $('list').innerHTML=V.map((v,i)=>{const has=live(CN+':'+v.n);return`<div class="p-5 bg-slate-900/60 rounded-2xl border border-slate-800 space-y-3">
 <div class="flex justify-between items-center text-xs border-b border-slate-800 pb-3"><b class="text-brand-400">${tg.includes(i)?'🎯 ':''}${v.n}</b><div class="flex gap-2">
 <button onclick="play(${i})" class="bg-slate-800 px-3 py-1.5 rounded-xl font-semibold">${T('audio')}</button>
 <button onclick="mark(${i})" class="${has?'bg-slate-800 text-slate-400':'bg-brand-500/20 border border-brand-500/40 text-brand-400'} px-3 py-1.5 rounded-xl font-semibold">${has?T('hafald'):T('hafal')}</button></div></div>
 <p class="ar text-3xl sm:text-4xl text-right" onclick="this.classList.toggle('show')">${v.t}</p>
 ${tr(v)?`<p class="text-sm text-slate-300">${esc(tr(v))}</p>`:''}</div>`}).join('')}
function mark(i){const k=CN+':'+V[i].n;if(live(k)){if(!confirm(T('unm')))return;S.items[k]={...S.items[k],x:1,u:Date.now()};save();draw();return}S.items[k]={s:CN,a:V[i].n,r:0,i:1,e:2.3,d:today()+1,l:0,u:Date.now()};act();save();draw();toast(T('toastH'))}
function focusMode(){focus=!focus;$('fbtn').classList.toggle('on',focus);$('list').classList.toggle('focus',focus)}

/* ===== 6. UI: MUROJAAH (active recall, sambung ayat) ===== */
async function drawMur(){mGuide();const due=Object.entries(S.items).filter(([,i])=>!i.x&&i.d<=today()).sort((a,b)=>a[1].d-b[1].d),box=$('mur');
